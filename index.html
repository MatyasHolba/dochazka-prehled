<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osobní přehled docházky | TimeClock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      .print-card { border: 1px solid #d1d5db !important; background: #ffffff !important; color: #000000 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <div class="max-w-3xl mx-auto px-4 py-6 sm:py-10">
    <!-- Hlavička -->
    <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl mb-6 print-card">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl font-bold shrink-0">
            ⏱️
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs uppercase tracking-wider font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">
                Ověřeno Ed25519
              </span>
              <span id="syncTimeBadge" class="text-xs text-slate-400"></span>
            </div>
            <h1 id="empName" class="text-2xl sm:text-3xl font-bold text-white mt-1">Načítání docházky...</h1>
          </div>
        </div>

        <!-- Přepínač měsíce -->
        <div class="flex items-center gap-2 no-print">
          <label for="monthSelect" class="text-xs font-medium text-slate-400 uppercase tracking-wider">Období:</label>
          <select id="monthSelect" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium">
          </select>
        </div>
      </div>
    </header>

    <!-- Stav chyby / info -->
    <div id="errorBanner" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-200 rounded-2xl p-4 mb-6 text-sm"></div>

    <!-- Souhrnné karty nahoře -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg print-card">
        <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Celkem odpracováno</p>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="statTotalHours" class="text-3xl font-extrabold text-emerald-400">0.0</span>
          <span class="text-sm text-slate-400 font-medium">hodin</span>
        </div>
      </div>

      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg print-card">
        <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Odpracovaných dnů</p>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="statWorkedDays" class="text-3xl font-extrabold text-white">0</span>
          <span class="text-sm text-slate-400 font-medium">dnů v měsíci</span>
        </div>
      </div>

      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg print-card">
        <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Průměr za den</p>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="statAvgHours" class="text-3xl font-extrabold text-sky-400">0.0</span>
          <span class="text-sm text-slate-400 font-medium">h / směna</span>
        </div>
      </div>
    </section>

    <!-- Akční lišta -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 no-print">
      <h2 id="tableTitle" class="text-lg font-semibold text-slate-200">Detailní přehled dnů</h2>
      <div class="flex items-center gap-2">
        <button id="btnDownloadCsv" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-md transition">
          <span>📥</span> Stáhnout výkaz (CSV)
        </button>
        <button id="btnPrint" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition">
          <span>🖨️</span> Tisk
        </button>
      </div>
    </div>

    <!-- Tabulka dnů -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-xl print-card">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 bg-slate-900/60 text-xs uppercase tracking-wider text-slate-400">
              <th class="py-3.5 px-4">Datum</th>
              <th class="py-3.5 px-3">Příchod</th>
              <th class="py-3.5 px-3">Odchod</th>
              <th class="py-3.5 px-3 text-right">Odpracováno</th>
              <th class="py-3.5 px-4">Ověření / Poznámka</th>
            </tr>
          </thead>
          <tbody id="daysTableBody" class="divide-y divide-slate-800/70 text-sm">
          </tbody>
        </table>
      </div>
    </div>

    <!-- Patička -->
    <footer class="mt-8 text-center text-xs text-slate-500 no-print">
      Serverless Kryptografický Docházkový Systém • Multi-Chain Ed25519 &amp; AES-256-GCM
    </footer>
  </div>

  <script>
    const MONTH_NAMES = [
      '', 'Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen',
      'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'
    ];
    const DAY_NAMES = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];

    let currentEmployeeData = null;
    let selectedMonthIndex = 0;

    function formatCzechDate(isoDate) {
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const dayName = DAY_NAMES[d.getDay()];
      return `${dayName} ${Number(parts[2])}. ${Number(parts[1])}.`;
    }

    function getAuthBadge(day) {
      if (day.is_override || day.auth_method === 'ADMIN') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-orange-500/15 text-orange-300 border border-orange-500/30">🔑 Upraveno mistrem</span>`;
      }
      if (day.auth_method === 'PIN') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-yellow-500/15 text-yellow-300 border border-yellow-500/30">⌨️ PIN bez čipu</span>`;
      }
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">💳 Čip OK</span>`;
    }

    function renderMonth(index) {
      if (!currentEmployeeData || !currentEmployeeData.months || !currentEmployeeData.months[index]) return;
      selectedMonthIndex = index;
      const m = currentEmployeeData.months[index];
      const monthLabel = `${MONTH_NAMES[m.month] || m.month} ${m.year}`;

      document.getElementById('statTotalHours').textContent = Number(m.total_hours || 0).toFixed(2);
      document.getElementById('statWorkedDays').textContent = m.worked_days || 0;
      document.getElementById('statAvgHours').textContent = Number(m.avg_hours_per_day || 0).toFixed(2);
      document.getElementById('tableTitle').textContent = `Přehled dnů – ${monthLabel}`;

      const tbody = document.getElementById('daysTableBody');
      tbody.innerHTML = '';

      const days = (m.days || []).slice().sort((a, b) => b.date.localeCompare(a.date));
      if (days.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">Žádné záznamy v tomto měsíci.</td></tr>`;
        return;
      }

      for (const day of days) {
        const tr = document.createElement('tr');
        tr.className = day.is_override
          ? 'bg-orange-950/15 hover:bg-slate-800/60 transition'
          : 'hover:bg-slate-800/50 transition';

        const inBadge = day.in
          ? `<span class="font-mono font-semibold text-emerald-400">${day.in}</span>`
          : `<span class="text-slate-500">—</span>`;

        const outBadge = day.out
          ? `<span class="font-mono font-semibold text-rose-400">${day.out}</span>`
          : `<span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">V práci</span>`;

        const hoursText = day.hours > 0
          ? `<span class="font-mono font-bold text-white">${Number(day.hours).toFixed(2)} h</span>`
          : `<span class="text-slate-500">0.00 h</span>`;

        const noteHtml = day.note
          ? `<div class="text-xs text-slate-300 mt-1">${day.note}</div>`
          : '';

        tr.innerHTML = `
          <td class="py-3.5 px-4 font-medium text-white whitespace-nowrap">${formatCzechDate(day.date)}</td>
          <td class="py-3.5 px-3 whitespace-nowrap">${inBadge}</td>
          <td class="py-3.5 px-3 whitespace-nowrap">${outBadge}</td>
          <td class="py-3.5 px-3 text-right whitespace-nowrap">${hoursText}</td>
          <td class="py-3.5 px-4">
            ${getAuthBadge(day)}
            ${noteHtml}
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    function exportCurrentMonthCsv() {
      if (!currentEmployeeData || !currentEmployeeData.months[selectedMonthIndex]) return;
      const m = currentEmployeeData.months[selectedMonthIndex];
      const rows = [
        ['Zaměstnanec', currentEmployeeData.full_name],
        ['Období', `${m.year}-${String(m.month).padStart(2, '0')}`],
        ['Celkem hodin', m.total_hours],
        ['Odpracováno dnů', m.worked_days],
        [],
        ['Datum', 'Příchod', 'Odchod', 'Odpracováno (h)', 'Ověření', 'Poznámka']
      ];
      for (const d of m.days || []) {
        rows.push([
          d.date,
          d.in || '',
          d.out || '',
          d.hours != null ? d.hours : 0,
          d.auth_method || 'CHIP',
          (d.note || '').replace(/"/g, '""')
        ]);
      }
      const csvContent = '\uFEFF' + rows.map(r => r.map(c => `"${c}"`).join(';')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const cleanName = (currentEmployeeData.full_name || 'vykaz').toLowerCase().replace(/\s+/g, '_');
      a.download = `dochazka_${cleanName}_${m.year}_${String(m.month).padStart(2, '0')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function loadAttendanceData() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('u') || 'demo_jan_novak';
      const banner = document.getElementById('errorBanner');

      if (!params.get('u')) {
        banner.classList.remove('hidden');
        banner.innerHTML = 'ℹ️ Zobrazuji <strong>ukázkový výkaz (Jan Novák)</strong>. Pro zobrazení vlastního výkazu naskenujte svůj osobní QR kód na terminálu (parametr <code>?u=váš_token</code>).';
      }

      try {
        const resp = await fetch(`./views/${encodeURIComponent(token)}.json`, { cache: 'no-store' });
        if (!resp.ok) {
          throw new Error(`Výkaz pro token "${token}" nebyl nalezen (HTTP ${resp.status}).`);
        }
        const data = await resp.json();
        currentEmployeeData = data;

        document.getElementById('empName').textContent = data.full_name || 'Zaměstnanec';
        if (data.generated_at) {
          const dt = new Date(data.generated_at);
          document.getElementById('syncTimeBadge').textContent = `Aktualizováno: ${dt.toLocaleDateString('cs-CZ')} ${dt.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}`;
        }

        const select = document.getElementById('monthSelect');
        select.innerHTML = '';
        (data.months || []).forEach((m, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${MONTH_NAMES[m.month] || m.month} ${m.year}`;
          select.appendChild(opt);
        });

        select.addEventListener('change', (e) => renderMonth(Number(e.target.value)));
        renderMonth(0);
      } catch (err) {
        document.getElementById('empName').textContent = 'Výkaz nenalezen';
        banner.classList.remove('hidden');
        banner.textContent = `Chyba při načítání docházky: ${err.message}`;
      }
    }

    document.getElementById('btnDownloadCsv').addEventListener('click', exportCurrentMonthCsv);
    document.getElementById('btnPrint').addEventListener('click', () => window.print());

    loadAttendanceData();
  </script>
</body>
</html>
